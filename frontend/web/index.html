<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Collectory — personal museum collection app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="collection_journey_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>collection_journey_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#F7F1E7;">
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#7C7469;">Loading Collectory…</div>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      function hideLoading() {
        if (loading) loading.remove();
      }
      new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          hideLoading();
        }
      }).observe(document.body, { childList: true, subtree: true });
      setTimeout(function () {
        if (!loading || !document.getElementById('loading')) return;
        loading.innerHTML = 'Still loading… Run: cd frontend && flutter build web --release, then serve build/web on port 8090.';
      }, 90000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
